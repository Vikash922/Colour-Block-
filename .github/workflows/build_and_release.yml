name: Build and Publish Android APK

on:
  push:
    tags:
      - 'v*' # Trigger automatically when you push a tag like v1.0
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (Playable/Installable)
        run: ./gradlew assembleDebug
        
      - name: Build Release APK (Unsigned)
        run: ./gradlew assembleRelease

      - name: Rename APKs for Release
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk ColorBlock-Playable.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk ColorBlock-Release-Unsigned.apk

      - name: Upload Artifacts (For Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlock-APKs
          path: |
            ColorBlock-Playable.apk
            ColorBlock-Release-Unsigned.apk

      - name: Create GitHub Release and Attach APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ColorBlock-Playable.apk
            ColorBlock-Release-Unsigned.apk
          generate_release_notes: true
