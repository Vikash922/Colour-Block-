name: Build and Publish Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Trigger automatically when you push a tag like v1.0
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Build Files (Keystore & Google Services)
        run: |
          # 1. Decode debug.keystore from base64 if it exists, otherwise generate a new one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          
          # 2. Create a dummy google-services.json to prevent the Google Services plugin from failing
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "dummy-project" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": { "package_name": "com.aistudio.weathertracker.kxmpzq" } } } ]
          }
          EOF

      - name: Build Debug APK (Playable/Installable)
        run: gradle assembleDebug
        
      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease

      - name: Rename APKs for Release
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk ColorBlock-Playable.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk ColorBlock-Release-Unsigned.apk

      - name: Upload Artifacts (For Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlock-APKs
          path: |
            ColorBlock-Playable.apk
            ColorBlock-Release-Unsigned.apk

      - name: Create GitHub Release and Attach APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ColorBlock-Playable.apk
            ColorBlock-Release-Unsigned.apk
          generate_release_notes: true
