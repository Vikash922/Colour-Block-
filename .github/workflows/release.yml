name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Google Services (Mock)
        run: |
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "dummy-project" },
            "client": [
              {
                "client_info": { 
                  "mobilesdk_app_id": "1:123456789:android:abcdef", 
                  "android_client_info": { "package_name": "com.aistudio.colorblock.blast" } 
                },
                "api_key": [ { "current_key": "dummy-api-key-123456789" } ]
              }
            ]
          }
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Rename APK for Release
        run: |
          mv app/build/outputs/apk/release/app-release.apk ColorBlock.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorBlock
          path: ColorBlock.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Update v1.0.${{ github.run_number }}"
          files: ColorBlock.apk
          generate_release_notes: true
